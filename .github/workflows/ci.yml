name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check -w strong-mode

      - name: Build package
        run: npm run build -w strong-mode

      - name: Pack release artifact
        working-directory: packages/strong-mode
        run: npm pack

      - name: Smoke test packed CLI
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find "${GITHUB_WORKSPACE}/packages/strong-mode" -maxdepth 1 -name '*.tgz' | head -n 1)"
          test -n "$tarball"
          mkdir -p /tmp/strong-mode-smoke
          cd /tmp/strong-mode-smoke
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm exec --yes --package="$tarball" strong-mode -- --dry-run --yes

      # Applies the packed CLI for real (install + post-apply checks) and then runs
      # the generated project's own fast gate, so the template must pass the gates
      # it installs. The template's example code doubles as the fixture.
      - name: Scaffold smoke test (install + gates)
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find "${GITHUB_WORKSPACE}/packages/strong-mode" -maxdepth 1 -name '*.tgz' | head -n 1)"
          test -n "$tarball"
          template="${GITHUB_WORKSPACE}/packages/scaffold-ultra/template"
          fixture=/tmp/strong-mode-scaffold
          mkdir -p "$fixture/src" "$fixture/tests"
          cp "$template/src/index.ts" "$fixture/src/"
          cp "$template/tests/index.test.ts" "$fixture/tests/"
          cd "$fixture"
          git init -q
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm exec --yes --package="$tarball" strong-mode -- --yes
          npm run check
          # Lint must type-check dot-directories (.storybook, also nested) and skip
          # whatever git ignores (.next), so an unparsable ignored file must not fail it.
          mkdir -p .storybook packages/web/.storybook .next
          printf 'const config = { stories: ["../src/**/*.stories.ts"] };\n\nexport default config;\n' > .storybook/main.ts
          cp .storybook/main.ts packages/web/.storybook/main.ts
          printf 'this is not valid JavaScript\n' > .next/build.js
          grep -qxF '.next/' .gitignore || echo '.next/' >> .gitignore
          npm run lint

      - name: Scaffold smoke test (CommonJS is rejected)
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find "${GITHUB_WORKSPACE}/packages/strong-mode" -maxdepth 1 -name '*.tgz' | head -n 1)"
          test -n "$tarball"
          fixture=/tmp/strong-mode-cjs
          mkdir -p "$fixture"
          cd "$fixture"
          npm init -y >/dev/null 2>&1
          npm pkg set type=commonjs
          if output="$(npm exec --yes --package="$tarball" strong-mode -- --yes 2>&1)"; then
            echo "strong-mode should reject a CommonJS project" >&2
            exit 1
          fi
          printf '%s\n' "$output"
          grep -q "requires an ES module project" <<<"$output"
          test "$(ls -A)" = "package.json"
